<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚽ 自主練チャレンジ！</title>
  <meta name="description" content="みんなで自主練を記録して応援し合おう！">
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Google Fonts (丸みのある親しみやすいフォント) -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #f0fdf4; /* 芝生をイメージした優しい薄緑 */
      -webkit-tap-highlight-color: transparent;
    }
    .pitch-gradient {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    }
    .card-shadow {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    .fade-in {
      animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-slate-800 pb-24">

  <!-- ==========================================
       ⚙️ 設定エリア（本番キー設定済み）
       ========================================== -->
  <script>
    const MY_LIFF_ID = "2012781434-uVaVDF3P";

    const firebaseConfig = {
      apiKey: "AIzaSyCcFTjeCn13api7dx7kz7nkz2ghTYU3x_s",
      authDomain: "football-training-9521b.firebaseapp.com",
      projectId: "football-training-9521b",
      storageBucket: "football-training-9521b.firebasestorage.app",
      messagingSenderId: "902610080547",
      appId: "1:902610080547:web:c547b7e9baf1a52cc97296"
    };
  </script>

  <!-- ヘッダー（選手ステータス・レベル表示） -->
  <header class="pitch-gradient text-white pt-5 pb-6 px-4 rounded-b-3xl shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <img id="userAvatar" src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=soccer" alt="icon" class="w-12 h-12 rounded-full border-2 border-white bg-white object-cover">
          <div>
            <div class="flex items-center space-x-2">
              <span id="playerNameDisplay" class="font-extrabold text-lg tracking-wide">選手名未設定</span>
              <button onclick="openNameModal()" class="text-xs bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-full transition">
                ✏️ 変更
              </button>
            </div>
            <div class="text-xs text-green-100 mt-0.5 flex items-center space-x-2">
              <span id="playerTitleBadge" class="bg-yellow-400 text-green-950 font-bold px-2 py-0.5 rounded-md">Lv.1 サッカー少年</span>
              <span id="totalMinutesDisplay">累計 0分</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 次のレベルまでの経験値バー -->
      <div class="mt-4 bg-black/20 rounded-full h-2.5 overflow-hidden p-0.5">
        <div id="levelProgressBar" class="bg-yellow-400 h-full rounded-full transition-all duration-500" style="width: 10%"></div>
      </div>
      <div class="flex justify-between text-[11px] text-green-100 mt-1">
        <span>次のレベルまで</span>
        <span id="nextLevelText">あと 60分！</span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="max-w-md mx-auto px-4 mt-5">
    
    <!-- エラー発生時のみ表示されるアラート -->
    <div id="configWarning" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 mb-4 rounded-r-xl shadow-sm">
      <p class="text-sm font-bold text-amber-800">⚠️ データベース接続エラー</p>
      <p id="errorDetailText" class="text-xs text-amber-700 mt-1">
        データの読み込みに失敗しました。通信環境を確認してください。
      </p>
    </div>

    <!-- ==========================================
         タブ1：みんなの練習タイムライン
         ========================================== -->
    <section id="tab-timeline" class="fade-in space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-extrabold text-lg text-slate-700 flex items-center">
          <span class="mr-1.5">🔥</span> みんなの自主練記録
        </h2>
        <button onclick="loadTimeline()" class="text-xs text-green-700 font-bold bg-green-100 px-3 py-1 rounded-full active:scale-95 transition">
          🔄 更新
        </button>
      </div>

      <!-- タイムライン一覧コンテナ -->
      <div id="timelineList" class="space-y-3">
        <div class="text-center py-10 text-slate-400 text-sm">
          読み込み中... ⚽
        </div>
      </div>
    </section>

    <!-- ==========================================
         タブ2：自主練を記録するフォーム
         ========================================== -->
    <section id="tab-record" class="hidden fade-in">
      <div class="bg-white rounded-3xl p-5 card-shadow space-y-5">
        <h2 class="font-extrabold text-lg text-green-800 text-center border-b border-slate-100 pb-3">
          ⚽ 今日の自主練を記録しよう！
        </h2>

        <!-- 練習メニュー選択（複数選択可） -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">1. どんな練習をした？（いくつでもOK）</label>
          <div class="grid grid-cols-2 gap-2" id="menuCheckboxes">
            <button type="button" onclick="toggleMenu(this, 'リフティング')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>⚽ リフティング</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'ドリブル')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>⚡ ドリブル</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'パス・トラップ')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>🎯 パス・トラップ</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'シュート')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>🥅 シュート</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, '体幹・ストレッチ')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>💪 体幹・柔軟</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'ランニング')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>🏃 ランニング</span><span class="check-icon opacity-0">✅</span>
            </button>
          </div>
        </div>

        <!-- 練習時間選択 -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">2. 何分くらい練習した？</label>
          <div class="grid grid-cols-4 gap-2" id="timeButtons">
            <button type="button" onclick="selectTime(this, 15)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">15分</button>
            <button type="button" onclick="selectTime(this, 30)" class="time-btn border-2 border-green-600 bg-green-50 text-green-700 rounded-xl py-2 text-sm font-extrabold transition">30分</button>
            <button type="button" onclick="selectTime(this, 45)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">45分</button>
            <button type="button" onclick="selectTime(this, 60)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">60分</button>
            <button type="button" onclick="selectTime(this, 90)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">90分</button>
            <button type="button" onclick="selectTime(this, 120)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">120分</button>
          </div>
        </div>

        <!-- リフティング最高回数（任意） -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">3. 今日のリフティング最高回数（任意）</label>
          <div class="relative">
            <input type="number" id="liftingCountInput" placeholder="例：25" min="0" max="9999" class="w-full border-2 border-slate-200 rounded-xl px-4 py-2.5 text-base font-bold focus:border-green-500 focus:outline-none">
            <span class="absolute right-4 top-2.5 text-slate-400 font-bold">回</span>
          </div>
        </div>

        <!-- がんばったことメモ -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">4. がんばったこと・感想（任意）</label>
          <textarea id="memoInput" rows="2" placeholder="例：左足のリフティングをたくさん練習した！" class="w-full border-2 border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-green-500 focus:outline-none"></textarea>
        </div>

        <!-- 送信ボタン -->
        <button id="submitBtn" onclick="submitPractice()" class="w-full pitch-gradient text-white font-extrabold text-base py-4 rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center space-x-2">
          <span>🎉 練習を記録してシェアする！</span>
        </button>
      </div>
    </section>

    <!-- ==========================================
         タブ3：チーム内ランキング
         ========================================== -->
    <section id="tab-ranking" class="hidden fade-in space-y-4">
      <div class="bg-white rounded-3xl p-5 card-shadow">
        <h2 class="font-extrabold text-lg text-center text-slate-800 mb-1">
          🏆 累計練習時間ランキング
        </h2>
        <p class="text-xs text-center text-slate-400 mb-4">コツコツ練習してレベルアップしよう！</p>
        
        <div id="rankingList" class="space-y-2.5">
          <!-- ランキングアイテムがここに入ります -->
        </div>
      </div>
    </section>

  </main>

  <!-- 下部ナビゲーションバー -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 z-30">
    <div class="max-w-md mx-auto grid grid-cols-3 gap-1">
      <button onclick="switchTab('timeline')" id="nav-timeline" class="nav-btn flex flex-col items-center py-1 text-green-600 font-extrabold">
        <span class="text-xl">📋</span>
        <span class="text-[11px] mt-0.5">みんなの記録</span>
      </button>
      <button onclick="switchTab('record')" id="nav-record" class="nav-btn flex flex-col items-center py-1 text-slate-400 font-bold">
        <div class="bg-green-600 text-white w-11 h-11 rounded-full flex items-center justify-center -mt-5 shadow-md border-4 border-white text-xl">
          ➕
        </div>
        <span class="text-[11px] mt-0.5 text-green-700 font-extrabold">記録する</span>
      </button>
      <button onclick="switchTab('ranking')" id="nav-ranking" class="nav-btn flex flex-col items-center py-1 text-slate-400 font-bold">
        <span class="text-xl">🏆</span>
        <span class="text-[11px] mt-0.5">ランキング</span>
      </button>
    </div>
  </nav>

  <!-- 選手名変更モーダル -->
  <div id="nameModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl">
      <h3 class="font-extrabold text-lg text-slate-800">⚽ 選手の名前を設定しよう</h3>
      <p class="text-xs text-slate-500">おうちの方のスマホを使う場合は、お子さまの名前と学年を入力してください。（例：ゆうと 3年）</p>
      <input type="text" id="playerNameInput" placeholder="例：ゆうと（3年）" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 font-bold focus:border-green-500 focus:outline-none">
      <div class="flex space-x-2 pt-2">
        <button onclick="closeNameModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl">キャンセル</button>
        <button onclick="savePlayerName()" class="flex-1 pitch-gradient text-white font-bold py-3 rounded-xl">保存する</button>
      </div>
    </div>
  </div>

  <!-- 記録削除確認モーダル -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl text-center">
      <div class="text-3xl">🗑️</div>
      <h3 class="font-extrabold text-lg text-slate-800">この記録を消しますか？</h3>
      <p class="text-xs text-slate-500">一度消すと元には戻せません。</p>
      <div class="flex space-x-2 pt-2">
        <button onclick="closeDeleteModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl">やめる</button>
        <button onclick="executeDelete()" class="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl">消す</button>
      </div>
    </div>
  </div>

  <!-- 通知トースト -->
  <div id="toast" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-sm font-bold px-5 py-3 rounded-full shadow-lg z-50 transition-opacity whitespace-nowrap">
    メッセージ
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    let db = null;
    let deleteTargetId = null;

    let localBrowserId = localStorage.getItem('soccer_browser_uid');
    if (!localBrowserId) {
      localBrowserId = 'user-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
      localStorage.setItem('soccer_browser_uid', localBrowserId);
    }

    let currentUser = {
      userId: localBrowserId,
      displayName: 'サッカー選手',
      pictureUrl: 'https://api.dicebear.com/7.x/fun-emoji/svg?seed=soccer',
      playerName: localStorage.getItem('soccer_player_name') || ''
    };

    let selectedMenus = [];
    let selectedMinutes = 30;

    window.onload = async function() {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      } catch (e) {
        console.error("Firebase初期化エラー:", e);
        document.getElementById('configWarning').classList.remove('hidden');
        document.getElementById('errorDetailText').textContent = e.message;
      }

      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUser.userId = profile.userId;
          currentUser.displayName = profile.displayName;
          if (profile.pictureUrl) {
            currentUser.pictureUrl = profile.pictureUrl;
          }
        } else if (liff.isInClient()) {
          liff.login();
        }
      } catch (err) {
        console.error("LIFF初期化エラー:", err);
      }

      if (!currentUser.playerName) {
        currentUser.playerName = currentUser.displayName;
      }
      updateUserHeader();

      if (!localStorage.getItem('soccer_player_name')) {
        openNameModal();
      }

      await loadTimeline();
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2800);
    }

    function updateUserHeader() {
      document.getElementById('playerNameDisplay').textContent = currentUser.playerName;
      document.getElementById('userAvatar').src = currentUser.pictureUrl;
    }

    function updateLevelDisplay(totalMinutes) {
      const level = Math.floor(totalMinutes / 60) + 1;
      const remainder = totalMinutes % 60;
      const progressPercent = Math.max(8, Math.round((remainder / 60) * 100));
      const nextMinutes = 60 - remainder;

      let title = "サッカー少年";
      if (level >= 30) title = "レジェンド";
      else if (level >= 20) title = "チームの要";
      else if (level >= 10) title = "ドリブルマスター";
      else if (level >= 5) title = "努力の天才";
      else if (level >= 2) title = "期待のルーキー";

      document.getElementById('playerTitleBadge').textContent = `Lv.${level} ${title}`;
      document.getElementById('totalMinutesDisplay').textContent = `累計 ${totalMinutes}分`;
      document.getElementById('levelProgressBar').style.width = `${progressPercent}%`;
      document.getElementById('nextLevelText').textContent = `あと ${nextMinutes}分！`;
    }

    function openNameModal() {
      document.getElementById('playerNameInput').value = localStorage.getItem('soccer_player_name') || '';
      document.getElementById('nameModal').classList.remove('hidden');
    }
    function closeNameModal() {
      document.getElementById('nameModal').classList.add('hidden');
    }
    function savePlayerName() {
      const val = document.getElementById('playerNameInput').value.trim();
      if (!val) {
        showToast("名前を入力してね！");
        return;
      }
      currentUser.playerName = val;
      localStorage.setItem('soccer_player_name', val);
      updateUserHeader();
      closeNameModal();
      showToast(`「${val}」で登録しました！`);
      loadTimeline();
    }

    function confirmDelete(logId) {
      deleteTargetId = logId;
      document.getElementById('deleteModal').classList.remove('hidden');
    }
    function closeDeleteModal() {
      deleteTargetId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    }
    async function executeDelete() {
      if (!deleteTargetId) return;
      const targetId = deleteTargetId;
      closeDeleteModal();

      try {
        await db.collection('practice_logs').doc(targetId).delete();
        showToast("🗑️ 記録を削除しました");
        await loadTimeline();
      } catch (e) {
        console.error("削除エラー:", e);
        showToast("削除に失敗しました");
      }
    }

    function switchTab(tabName) {
      ['timeline', 'record', 'ranking'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const navBtn = document.getElementById(`nav-${t}`);
        if (t !== 'record') {
          navBtn.classList.remove('text-green-600', 'font-extrabold');
          navBtn.classList.add('text-slate-400', 'font-bold');
        }
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      if (tabName !== 'record') {
        const activeNav = document.getElementById(`nav-${tabName}`);
        activeNav.classList.remove('text-slate-400', 'font-bold');
        activeNav.classList.add('text-green-600', 'font-extrabold');
      }

      if (tabName === 'timeline') loadTimeline();
      if (tabName === 'ranking') loadRanking();
    }

    function toggleMenu(btn, menuName) {
      const idx = selectedMenus.indexOf(menuName);
      const icon = btn.querySelector('.check-icon');
      if (idx === -1) {
        selectedMenus.push(menuName);
        btn.classList.add('border-green-600', 'bg-green-50', 'text-green-800');
        btn.classList.remove('border-slate-200', 'text-slate-600');
        icon.classList.remove('opacity-0');
      } else {
        selectedMenus.splice(idx, 1);
        btn.classList.remove('border-green-600', 'bg-green-50', 'text-green-800');
        btn.classList.add('border-slate-200', 'text-slate-600');
        icon.classList.add('opacity-0');
      }
    }

    function selectTime(btn, mins) {
      selectedMinutes = mins;
      document.querySelectorAll('.time-btn').forEach(b => {
        b.classList.remove('border-green-600', 'bg-green-50', 'text-green-700');
        b.classList.add('border-slate-200', 'text-slate-600');
      });
      btn.classList.remove('border-slate-200', 'text-slate-600');
      btn.classList.add('border-green-600', 'bg-green-50', 'text-green-700');
    }

    async function submitPractice() {
      if (selectedMenus.length === 0) {
        showToast("練習メニューを1つ以上選んでね！⚽");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>送信中... ⏳</span>';

      const liftingVal = document.getElementById('liftingCountInput').value;
      const memoVal = document.getElementById('memoInput').value.trim();

      const newRecord = {
        userId: currentUser.userId,
        playerName: currentUser.playerName,
        avatar: currentUser.pictureUrl,
        menus: [...selectedMenus],
        minutes: selectedMinutes,
        liftingCount: liftingVal ? parseInt(liftingVal, 10) : null,
        memo: memoVal,
        stamps: { nice: 0, fire: 0, clap: 0 },
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection('practice_logs').add(newRecord);

        selectedMenus = [];
        document.querySelectorAll('.menu-btn').forEach(b => {
          b.classList.remove('border-green-600', 'bg-green-50', 'text-green-800');
          b.classList.add('border-slate-200', 'text-slate-600');
          b.querySelector('.check-icon').classList.add('opacity-0');
        });
        document.getElementById('liftingCountInput').value = '';
        document.getElementById('memoInput').value = '';

        showToast("🎉 ナイス練習！記録をシェアしたよ！");
        switchTab('timeline');
      } catch (error) {
        console.error("保存エラー:", error);
        showToast("保存に失敗しました。通信環境を確認してください。");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🎉 練習を記録してシェアする！</span>';
      }
    }

    async function loadTimeline() {
      const listEl = document.getElementById('timelineList');
      let logs = [];

      try {
        const snapshot = await db.collection('practice_logs')
          .orderBy('createdAt', 'desc')
          .limit(40)
          .get();
        snapshot.forEach(doc => {
          const data = doc.data();
          logs.push({
            id: doc.id,
            ...data,
            createdAt: data.createdAt ? data.createdAt.toDate() : new Date()
          });
        });

        const myTotal = logs
          .filter(l => l.playerName === currentUser.playerName || l.userId === currentUser.userId)
          .reduce((sum, l) => sum + (l.minutes || 0), 0);
        updateLevelDisplay(myTotal);

        if (logs.length === 0) {
          listEl.innerHTML = `
            <div class="bg-white rounded-2xl p-8 text-center card-shadow">
              <p class="text-3xl mb-2">⚽</p>
              <p class="font-bold text-slate-600">まだ記録がありません</p>
              <p class="text-xs text-slate-400 mt-1">下の「＋ 記録する」から最初の自主練を投稿しよう！</p>
            </div>`;
          return;
        }

        listEl.innerHTML = logs.map(log => {
          const timeStr = formatTimeAgo(log.createdAt);
          const badgesHtml = (log.menus || []).map(m => 
            `<span class="bg-green-100 text-green-800 text-xs font-bold px-2.5 py-0.5 rounded-full">${m}</span>`
          ).join('');

          const liftingHtml = log.liftingCount 
            ? `<div class="mt-2 inline-block bg-yellow-50 border border-yellow-200 text-yellow-800 text-xs font-extrabold px-3 py-1 rounded-lg">👑 リフティング：${log.liftingCount}回！</div>` 
            : '';

          const memoHtml = log.memo 
            ? `<p class="mt-2 text-sm text-slate-600 bg-slate-50 p-2.5 rounded-xl">${escapeHtml(log.memo)}</p>` 
            : '';

          const isMyPost = (log.userId === currentUser.userId) || (log.playerName === currentUser.playerName);
          const deleteBtnHtml = isMyPost 
            ? `<button onclick="confirmDelete('${log.id}')" class="text-slate-300 hover:text-red-500 px-1.5 py-0.5 text-sm transition" title="削除">🗑️</button>` 
            : '';

          const stamps = log.stamps || { nice: 0, fire: 0, clap: 0 };
          const myStamped = getMyStamped(log.id);
          const niceClass = myStamped.nice ? 'bg-green-100 border-green-500 text-green-800' : 'bg-slate-50 border-slate-200 text-slate-700';
          const fireClass = myStamped.fire ? 'bg-orange-100 border-orange-500 text-orange-800' : 'bg-slate-50 border-slate-200 text-slate-700';
          const clapClass = myStamped.clap ? 'bg-blue-100 border-blue-500 text-blue-800' : 'bg-slate-50 border-slate-200 text-slate-700';

          return `
            <div class="bg-white rounded-3xl p-4 card-shadow space-y-2.5">
              <!-- 投稿者ヘッダー -->
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                  <img src="${log.avatar || 'https://api.dicebear.com/7.x/fun-emoji/svg?seed=soccer'}" class="w-10 h-10 rounded-full bg-slate-100 object-cover">
                  <div>
                    <p class="font-extrabold text-sm text-slate-800">${escapeHtml(log.playerName || '選手')}</p>
                    <p class="text-[11px] text-slate-400">${timeStr}</p>
                  </div>
                </div>
                <div class="flex items-center space-x-1.5">
                  <span class="bg-green-600 text-white text-xs font-extrabold px-3 py-1 rounded-full">
                    ⏱️ ${log.minutes}分
                  </span>
                  ${deleteBtnHtml}
                </div>
              </div>

              <!-- メニュー・記録内容 -->
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${badgesHtml}
              </div>
              ${liftingHtml}
              ${memoHtml}

              <!-- 応援スタンプボタン（1人1回・トグル式） -->
              <div class="pt-2 border-t border-slate-100 flex items-center space-x-2">
                <button onclick="toggleStamp('${log.id}', 'nice', this)" class="flex-1 hover:bg-green-50 active:scale-95 border rounded-xl py-1.5 text-xs font-bold transition ${niceClass}">
                  ⚽ ナイス! <span class="stamp-count text-green-700 font-extrabold">${stamps.nice || 0}</span>
                </button>
                <button onclick="toggleStamp('${log.id}', 'fire', this)" class="flex-1 hover:bg-orange-50 active:scale-95 border rounded-xl py-1.5 text-xs font-bold transition ${fireClass}">
                  🔥 すごい! <span class="stamp-count text-orange-600 font-extrabold">${stamps.fire || 0}</span>
                </button>
                <button onclick="toggleStamp('${log.id}', 'clap', this)" class="flex-1 hover:bg-blue-50 active:scale-95 border rounded-xl py-1.5 text-xs font-bold transition ${clapClass}">
                  👏 おつかれ! <span class="stamp-count text-blue-600 font-extrabold">${stamps.clap || 0}</span>
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        console.error("タイムライン取得エラー:", e);
        document.getElementById('configWarning').classList.remove('hidden');
        document.getElementById('errorDetailText').textContent = e.message;
        listEl.innerHTML = `<p class="text-center text-red-500 text-sm py-6">データの読み込みに失敗しました。</p>`;
      }
    }

    function getMyStamped(logId) {
      try {
        const all = JSON.parse(localStorage.getItem('soccer_my_stamps') || '{}');
        return all[logId] || { nice: false, fire: false, clap: false };
      } catch (e) {
        return { nice: false, fire: false, clap: false };
      }
    }

    function saveMyStamped(logId, stampedObj) {
      try {
        const all = JSON.parse(localStorage.getItem('soccer_my_stamps') || '{}');
        all[logId] = stampedObj;
        localStorage.setItem('soccer_my_stamps', JSON.stringify(all));
      } catch (e) {
        console.error(e);
      }
    }

    async function toggleStamp(logId, type, btnElement) {
      if (btnElement.dataset.loading === 'true') return;
      btnElement.dataset.loading = 'true';

      const myStamped = getMyStamped(logId);
      const isAlreadyStamped = !!myStamped[type];
      const delta = isAlreadyStamped ? -1 : 1;

      const countSpan = btnElement.querySelector('.stamp-count');
      const currentCount = parseInt(countSpan.textContent, 10) || 0;
      const nextCount = Math.max(0, currentCount + delta);
      countSpan.textContent = nextCount;

      const colorMap = {
        nice: ['bg-green-100', 'border-green-500', 'text-green-800'],
        fire: ['bg-orange-100', 'border-orange-500', 'text-orange-800'],
        clap: ['bg-blue-100', 'border-blue-500', 'text-blue-800']
      };
      const activeClasses = colorMap[type];

      if (!isAlreadyStamped) {
        btnElement.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-700');
        btnElement.classList.add(...activeClasses);
        myStamped[type] = true;
      } else {
        btnElement.classList.remove(...activeClasses);
        btnElement.classList.add('bg-slate-50', 'border-slate-200', 'text-slate-700');
        myStamped[type] = false;
      }
      saveMyStamped(logId, myStamped);

      try {
        const docRef = db.collection('practice_logs').doc(logId);
        await docRef.update({
          [`stamps.${type}`]: firebase.firestore.FieldValue.increment(delta)
        });
      } catch (e) {
        console.error("スタンプ更新エラー:", e);
      } finally {
        btnElement.dataset.loading = 'false';
      }
    }

    async function loadRanking() {
      const rankingEl = document.getElementById('rankingList');
      rankingEl.innerHTML = `<p class="text-center text-slate-400 text-sm py-6">集計中... 🏆</p>`;

      let logs = [];
      try {
        const snapshot = await db.collection('practice_logs').get();
        snapshot.forEach(doc => logs.push(doc.data()));

        const map = {};
        logs.forEach(log => {
          const name = log.playerName || 'ななし';
          if (!map[name]) {
            map[name] = {
              playerName: name,
              avatar: log.avatar,
              totalMinutes: 0,
              count: 0
            };
          }
          map[name].totalMinutes += (log.minutes || 0);
          map[name].count += 1;
        });

        const sorted = Object.values(map).sort((a, b) => b.totalMinutes - a.totalMinutes);

        if (sorted.length === 0) {
          rankingEl.innerHTML = `<p class="text-center text-slate-400 text-sm py-6">まだデータがありません</p>`;
          return;
        }

        rankingEl.innerHTML = sorted.map((player, index) => {
          let medal = `<span class="w-7 text-center font-extrabold text-slate-400">${index + 1}</span>`;
          let bgClass = "bg-slate-50";
          if (index === 0) { medal = `<span class="text-2xl">🥇</span>`; bgClass = "bg-yellow-50 border border-yellow-200"; }
          if (index === 1) { medal = `<span class="text-2xl">🥈</span>`; bgClass = "bg-slate-100 border border-slate-200"; }
          if (index === 2) { medal = `<span class="text-2xl">🥉</span>`; bgClass = "bg-orange-50 border border-orange-200"; }

          const lv = Math.floor(player.totalMinutes / 60) + 1;

          return `
            <div class="${bgClass} rounded-2xl p-3 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                ${medal}
                <img src="${player.avatar || 'https://api.dicebear.com/7.x/fun-emoji/svg?seed=soccer'}" class="w-10 h-10 rounded-full bg-white object-cover">
                <div>
                  <p class="font-extrabold text-sm text-slate-800">${escapeHtml(player.playerName)}</p>
                  <p class="text-[11px] text-slate-500">Lv.${lv} ・ 練習 ${player.count}回</p>
                </div>
              </div>
              <div class="text-right">
                <span class="font-extrabold text-base text-green-700">${player.totalMinutes}</span>
                <span class="text-xs font-bold text-slate-500">分</span>
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        console.error("ランキング取得エラー:", e);
        rankingEl.innerHTML = `<p class="text-center text-red-500 text-sm py-4">集計に失敗しました。</p>`;
      }
    }

    function formatTimeAgo(date) {
      if (!date) return '';
      const diffSec = Math.floor((new Date() - date) / 1000);
      if (diffSec < 60) return 'たった今';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}分前`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}時間前`;
      const diffDay = Math.floor(diffHour / 24);
      return `${diffDay}日前`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }
  </script>
</body>
</html>
