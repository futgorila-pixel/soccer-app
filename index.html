<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚽ 自主練チャレンジ！</title>
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Google Fonts (丸みのある親しみやすいフォント) -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #f0fdf4; /* 芝生をイメージした優しい薄緑 */
      -webkit-tap-highlight-color: transparent;
    }
    .pitch-gradient {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    }
    .card-shadow {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    /* タブ切り替えアニメーション */
    .fade-in {
      animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-slate-800 pb-24">

  <!-- ==========================================
       ⚙️ 設定エリア（ここだけご自身の情報に書き換えます！）
       ========================================== -->
  <script>
    // 1. LINE Developers で取得した LIFF ID を貼り付けてください
    const MY_LIFF_ID = "2012781434-uVaVDF3P";

    // 2. Firebase で取得した firebaseConfig の中身を貼り付けてください
    const firebaseConfig = {
      apiKey: "AIzaSyCcFTjeCn13api7dx7kz7nkz2ghTYU3x_s",
      authDomain: "football-training-9521b.firebaseapp.com",
      projectId: "football-training-9521b",
      storageBucket: "football-training-9521b.firebasestorage.app",
      messagingSenderId: "902610080547",
      appId: "1:902610080547:web:c547b7e9baf1a52cc97296"
    };
  </script>

  <!-- ヘッダー（選手ステータス・レベル表示） -->
  <header class="pitch-gradient text-white pt-5 pb-6 px-4 rounded-b-3xl shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <img id="userAvatar" src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=soccer" alt="icon" class="w-12 h-12 rounded-full border-2 border-white bg-white object-cover">
          <div>
            <div class="flex items-center space-x-2">
              <span id="playerNameDisplay" class="font-extrabold text-lg tracking-wide">選手名未設定</span>
              <button onclick="openNameModal()" class="text-xs bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-full transition">
                ✏️ 変更
              </button>
            </div>
            <div class="text-xs text-green-100 mt-0.5 flex items-center space-x-2">
              <span id="playerTitleBadge" class="bg-yellow-400 text-green-950 font-bold px-2 py-0.5 rounded-md">Lv.1 サッカー少年</span>
              <span id="totalMinutesDisplay">累計 0分</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 次のレベルまでの経験値バー -->
      <div class="mt-4 bg-black/20 rounded-full h-2.5 overflow-hidden p-0.5">
        <div id="levelProgressBar" class="bg-yellow-400 h-full rounded-full transition-all duration-500" style="width: 10%"></div>
      </div>
      <div class="flex justify-between text-[11px] text-green-100 mt-1">
        <span>次のレベルまで</span>
        <span id="nextLevelText">あと 60分！</span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="max-w-md mx-auto px-4 mt-5">
    
    <!-- 設定未完了時のアラート（管理者向けガイド） -->
    <div id="configWarning" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 mb-4 rounded-r-xl shadow-sm">
      <p class="text-sm font-bold text-amber-800">⚠️ 初期設定（デモモードで動作中）</p>
      <p class="text-xs text-amber-700 mt-1">
        現在お試しモードで動いています。チームでデータを保存するには、コード内の <code>MY_LIFF_ID</code> と <code>firebaseConfig</code> を書き換えてください。
      </p>
    </div>

    <!-- ==========================================
         タブ1：みんなの練習タイムライン
         ========================================== -->
    <section id="tab-timeline" class="fade-in space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-extrabold text-lg text-slate-700 flex items-center">
          <span class="mr-1.5">🔥</span> みんなの自主練記録
        </h2>
        <button onclick="loadTimeline()" class="text-xs text-green-700 font-bold bg-green-100 px-3 py-1 rounded-full active:scale-95 transition">
          🔄 更新
        </button>
      </div>

      <!-- タイムライン一覧コンテナ -->
      <div id="timelineList" class="space-y-3">
        <div class="text-center py-10 text-slate-400 text-sm">
          読み込み中... ⚽
        </div>
      </div>
    </section>

    <!-- ==========================================
         タブ2：自主練を記録するフォーム
         ========================================== -->
    <section id="tab-record" class="hidden fade-in">
      <div class="bg-white rounded-3xl p-5 card-shadow space-y-5">
        <h2 class="font-extrabold text-lg text-green-800 text-center border-b border-slate-100 pb-3">
          ⚽ 今日の自主練を記録しよう！
        </h2>

        <!-- 練習メニュー選択（複数選択可） -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">1. どんな練習をした？（いくつでもOK）</label>
          <div class="grid grid-cols-2 gap-2" id="menuCheckboxes">
            <button type="button" onclick="toggleMenu(this, 'リフティング')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>⚽ リフティング</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'ドリブル')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>⚡ ドリブル</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'パス・トラップ')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>🎯 パス・トラップ</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'シュート')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>🥅 シュート</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, '体幹・ストレッチ')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>💪 体幹・柔軟</span><span class="check-icon opacity-0">✅</span>
            </button>
            <button type="button" onclick="toggleMenu(this, 'ランニング')" class="menu-btn border-2 border-slate-200 rounded-xl py-2.5 px-3 text-sm font-bold text-slate-600 text-left flex items-center justify-between transition">
              <span>🏃 ランニング</span><span class="check-icon opacity-0">✅</span>
            </button>
          </div>
        </div>

        <!-- 練習時間選択 -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">2. 何分くらい練習した？</label>
          <div class="grid grid-cols-4 gap-2" id="timeButtons">
            <button type="button" onclick="selectTime(this, 15)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">15分</button>
            <button type="button" onclick="selectTime(this, 30)" class="time-btn border-2 border-green-600 bg-green-50 text-green-700 rounded-xl py-2 text-sm font-extrabold transition">30分</button>
            <button type="button" onclick="selectTime(this, 45)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">45分</button>
            <button type="button" onclick="selectTime(this, 60)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">60分</button>
            <button type="button" onclick="selectTime(this, 90)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">90分</button>
            <button type="button" onclick="selectTime(this, 120)" class="time-btn border-2 border-slate-200 rounded-xl py-2 text-sm font-extrabold text-slate-600 transition">120分</button>
          </div>
        </div>

        <!-- リフティング最高回数（任意） -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">3. 今日のリフティング最高回数（任意）</label>
          <div class="relative">
            <input type="number" id="liftingCountInput" placeholder="例：25" min="0" max="9999" class="w-full border-2 border-slate-200 rounded-xl px-4 py-2.5 text-base font-bold focus:border-green-500 focus:outline-none">
            <span class="absolute right-4 top-2.5 text-slate-400 font-bold">回</span>
          </div>
        </div>

        <!-- がんばったことメモ -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">4. がんばったこと・感想（任意）</label>
          <textarea id="memoInput" rows="2" placeholder="例：左足のリフティングをたくさん練習した！" class="w-full border-2 border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-green-500 focus:outline-none"></textarea>
        </div>

        <!-- 送信ボタン -->
        <button id="submitBtn" onclick="submitPractice()" class="w-full pitch-gradient text-white font-extrabold text-base py-4 rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center space-x-2">
          <span>🎉 練習を記録してシェアする！</span>
        </button>
      </div>
    </section>

    <!-- ==========================================
         タブ3：チーム内ランキング
         ========================================== -->
    <section id="tab-ranking" class="hidden fade-in space-y-4">
      <div class="bg-white rounded-3xl p-5 card-shadow">
        <h2 class="font-extrabold text-lg text-center text-slate-800 mb-1">
          🏆 累計練習時間ランキング
        </h2>
        <p class="text-xs text-center text-slate-400 mb-4">コツコツ練習してレベルアップしよう！</p>
        
        <div id="rankingList" class="space-y-2.5">
          <!-- ランキングアイテムがここに入ります -->
        </div>
      </div>
    </section>

  </main>

  <!-- 下部ナビゲーションバー -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 z-30">
    <div class="max-w-md mx-auto grid grid-cols-3 gap-1">
      <button onclick="switchTab('timeline')" id="nav-timeline" class="nav-btn flex flex-col items-center py-1 text-green-600 font-extrabold">
        <span class="text-xl">📋</span>
        <span class="text-[11px] mt-0.5">みんなの記録</span>
      </button>
      <button onclick="switchTab('record')" id="nav-record" class="nav-btn flex flex-col items-center py-1 text-slate-400 font-bold">
        <div class="bg-green-600 text-white w-11 h-11 rounded-full flex items-center justify-center -mt-5 shadow-md border-4 border-white text-xl">
          ➕
        </div>
        <span class="text-[11px] mt-0.5 text-green-700 font-extrabold">記録する</span>
      </button>
      <button onclick="switchTab('ranking')" id="nav-ranking" class="nav-btn flex flex-col items-center py-1 text-slate-400 font-bold">
        <span class="text-xl">🏆</span>
        <span class="text-[11px] mt-0.5">ランキング</span>
      </button>
    </div>
  </nav>

  <!-- 選手名変更モーダル（親のスマホから使う場合の配慮） -->
  <div id="nameModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl">
      <h3 class="font-extrabold text-lg text-slate-800">⚽ 選手の名前を設定しよう</h3>
      <p class="text-xs text-slate-500">おうちの方のスマホを使う場合は、お子さまの名前と学年を入力してください。（例：たろう 3年）</p>
      <input type="text" id="playerNameInput" placeholder="例：たろう（3年）" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 font-bold focus:border-green-500 focus:outline-none">
      <div class="flex space-x-2 pt-2">
        <button onclick="closeNameModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl">キャンセル</button>
        <button onclick="savePlayerName()" class="flex-1 pitch-gradient text-white font-bold py-3 rounded-xl">保存する</button>
      </div>
    </div>
  </div>

  <!-- 通知トースト（alertの代わり） -->
  <div id="toast" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-sm font-bold px-5 py-3 rounded-full shadow-lg z-50 transition-opacity">
    メッセージ
  </div>

  <!-- Firebase SDK (Compat版を使用して単一HTMLでシンプルに動作) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // ==========================================
    // アプリのメインロジック
    // ==========================================
    let db = null;
    let isDemoMode = false;
    let currentUser = {
      userId: 'demo-user-' + Math.floor(Math.random() * 1000),
      displayName: 'サッカー少年',
      pictureUrl: 'https://api.dicebear.com/7.x/fun-emoji/svg?seed=soccer',
      playerName: localStorage.getItem('soccer_player_name') || ''
    };

    // フォーム選択状態
    let selectedMenus = [];
    let selectedMinutes = 30;

    // デモ用の初期データ（Firebase未設定時でも画面を確認できるようにするため）
    let demoLogs = [
      {
        id: 'demo1',
        playerName: 'はるき（4年）',
        avatar: 'https://api.dicebear.com/7.x/fun-emoji/svg?seed=haruki',
        menus: ['リフティング', 'ドリブル'],
        minutes: 45,
        liftingCount: 38,
        memo: 'リフティング自己ベスト更新できた！',
        createdAt: new Date(Date.now() - 1000 * 60 * 30),
        stamps: { nice: 3, fire: 2, clap: 1 }
      },
      {
        id: 'demo2',
        playerName: 'そうた（3年）',
        avatar: 'https://api.dicebear.com/7.x/fun-emoji/svg?seed=souta',
        menus: ['パス・トラップ', 'シュート'],
        minutes: 30,
        liftingCount: null,
        memo: 'お父さんと壁当てパス練習をした！',
        createdAt: new Date(Date.now() - 1000 * 60 * 180),
        stamps: { nice: 5, fire: 1, clap: 4 }
      }
    ];

    // 初期化処理
    window.onload = async function() {
      // 1. Firebaseの初期化チェック
      if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("ここに")) {
        try {
          firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) {
          console.error("Firebase初期化エラー:", e);
          isDemoMode = true;
        }
      } else {
        isDemoMode = true;
        document.getElementById('configWarning').classList.remove('hidden');
      }

      // 2. LINE LIFFの初期化
      if (MY_LIFF_ID && !MY_LIFF_ID.includes("ここに")) {
        try {
          await liff.init({ liffId: MY_LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUser.userId = profile.userId;
            currentUser.displayName = profile.displayName;
            if (profile.pictureUrl) {
              currentUser.pictureUrl = profile.pictureUrl;
            }
          } else if (liff.isInClient()) {
            liff.login();
          }
        } catch (err) {
          console.error("LIFF初期化エラー:", err);
        }
      }

      // ユーザー表示の更新
      if (!currentUser.playerName) {
        currentUser.playerName = currentUser.displayName;
      }
      updateUserHeader();

      // 初回選手名が未設定ならモーダルを表示
      if (!localStorage.getItem('soccer_player_name')) {
        openNameModal();
      }

      // タイムライン読み込み
      await loadTimeline();
    };

    // トースト通知表示関数
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2800);
    }

    // ヘッダー情報の更新
    function updateUserHeader() {
      document.getElementById('playerNameDisplay').textContent = currentUser.playerName;
      document.getElementById('userAvatar').src = currentUser.pictureUrl;
    }

    // レベル計算とヘッダー反映
    function updateLevelDisplay(totalMinutes) {
      // 60分ごとに1レベルアップ
      const level = Math.floor(totalMinutes / 60) + 1;
      const remainder = totalMinutes % 60;
      const progressPercent = Math.max(8, Math.round((remainder / 60) * 100));
      const nextMinutes = 60 - remainder;

      // レベルに応じた称号
      let title = "サッカー少年";
      if (level >= 30) title = "レジェンド";
      else if (level >= 20) title = "チームの要";
      else if (level >= 10) title = "ドリブルマスター";
      else if (level >= 5) title = "努力の天才";
      else if (level >= 2) title = "期待のルーキー";

      document.getElementById('playerTitleBadge').textContent = `Lv.${level} ${title}`;
      document.getElementById('totalMinutesDisplay').textContent = `累計 ${totalMinutes}分`;
      document.getElementById('levelProgressBar').style.width = `${progressPercent}%`;
      document.getElementById('nextLevelText').textContent = `あと ${nextMinutes}分！`;
    }

    // 選手名変更モーダル操作
    function openNameModal() {
      document.getElementById('playerNameInput').value = localStorage.getItem('soccer_player_name') || '';
      document.getElementById('nameModal').classList.remove('hidden');
    }
    function closeNameModal() {
      document.getElementById('nameModal').classList.add('hidden');
    }
    function savePlayerName() {
      const val = document.getElementById('playerNameInput').value.trim();
      if (!val) {
        showToast("名前を入力してね！");
        return;
      }
      currentUser.playerName = val;
      localStorage.setItem('soccer_player_name', val);
      updateUserHeader();
      closeNameModal();
      showToast(`「${val}」で登録しました！`);
      loadTimeline();
    }

    // タブ切り替え
    function switchTab(tabName) {
      ['timeline', 'record', 'ranking'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const navBtn = document.getElementById(`nav-${t}`);
        if (t !== 'record') {
          navBtn.classList.remove('text-green-600', 'font-extrabold');
          navBtn.classList.add('text-slate-400', 'font-bold');
        }
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      if (tabName !== 'record') {
        const activeNav = document.getElementById(`nav-${tabName}`);
        activeNav.classList.remove('text-slate-400', 'font-bold');
        activeNav.classList.add('text-green-600', 'font-extrabold');
      }

      if (tabName === 'timeline') loadTimeline();
      if (tabName === 'ranking') loadRanking();
    }

    // 練習メニュー選択トグル
    function toggleMenu(btn, menuName) {
      const idx = selectedMenus.indexOf(menuName);
      const icon = btn.querySelector('.check-icon');
      if (idx === -1) {
        selectedMenus.push(menuName);
        btn.classList.add('border-green-600', 'bg-green-50', 'text-green-800');
        btn.classList.remove('border-slate-200', 'text-slate-600');
        icon.classList.remove('opacity-0');
      } else {
        selectedMenus.splice(idx, 1);
        btn.classList.remove('border-green-600', 'bg-green-50', 'text-green-800');
        btn.classList.add('border-slate-200', 'text-slate-600');
        icon.classList.add('opacity-0');
      }
    }

    // 練習時間選択
    function selectTime(btn, mins) {
      selectedMinutes = mins;
      document.querySelectorAll('.time-btn').forEach(b => {
        b.classList.remove('border-green-600', 'bg-green-50', 'text-green-700');
        b.classList.add('border-slate-200', 'text-slate-600');
      });
      btn.classList.remove('border-slate-200', 'text-slate-600');
      btn.classList.add('border-green-600', 'bg-green-50', 'text-green-700');
    }

    // 練習記録の保存処理
    async function submitPractice() {
      if (selectedMenus.length === 0) {
        showToast("練習メニューを1つ以上選んでね！⚽");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disable
